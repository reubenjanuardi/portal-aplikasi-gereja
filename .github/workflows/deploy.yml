name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. CI STAGE: Automated Tests & Lint
  # ==========================================
  test:
    name: Run Tests & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, bcmath, zip, gd
          coverage: none

      - name: Copy .env.example
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Pest / PHPUnit Tests
        run: php artisan test

  # ==========================================
  # 2. BUILD & PUSH DOCKER IMAGE KE GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. CD STAGE: Deploy ke VPS via SSH
  # ==========================================
  deploy:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on VPS..."
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/stacks/keuangan-gereja' }}
            
            echo "📥 1/6 Pulling latest Docker image from GHCR..."
            docker compose pull app
            
            echo "💾 2/6 Creating Pre-Deployment Database Backup..."
            mkdir -p ./backups
            docker compose run --rm app php artisan backup:run --only-db || {
                echo "⚠️ Warning: Pre-deployment backup encountered an issue. Continuing..."
            }
            find ./backups -type f -name "*.zip" -mtime +14 -delete 2>/dev/null || true
            
            echo "📦 3/6 Running Database Migrations (Supabase)..."
            docker compose run --rm app php artisan migrate --force
            
            echo "🔄 4/6 Restarting application container..."
            docker compose up -d --remove-orphans app
            
            echo "⚡ 5/6 Optimizing Laravel caches..."
            docker compose exec -T app php artisan optimize
            docker compose exec -T app php artisan filament:cache-components || true
            
            echo "🧹 6/6 Cleaning up dangling Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
