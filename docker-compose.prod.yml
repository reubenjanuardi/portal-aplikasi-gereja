version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/reubenjanuardi/portal-aplikasi-gereja:latest}
    container_name: keuangan-gereja-app
    restart: unless-stopped
    volumes:
      # Mount environment file produksi dari host VPS
      - ./.env:/var/www/html/.env:ro
      # Mount direktori logging persisten untuk troubleshooting & audit
      - ./storage/logs:/var/www/html/storage/logs
      # Mount direktori storage public persisten untuk upload logo & aset lokal
      - ./storage/app/public:/var/www/html/storage/app/public
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
